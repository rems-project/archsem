arch = "AArch64"
name = "Inval+LDR"
symbolic = ["x", "y"]

page_table_setup = """
physical pa_x;
x |-> pa_x;

*pa_x = 3;
"""

[thread.0]
code = """
    STR X0, [X1]
    DSB SY
faulting_instr:
    LDR X3, [X2]
normal_end:
"""
breakpoints = [0x4242400]

[thread.0.init]
X0 = 0
X1 = "pte3(x, page_table_base)"
X2 = "x"
VBAR_EL1 = 0x4242000
# Sort out the vm profile vs um profile setup
SCTLR_EL1 = 1
ESR_EL1 = 0
ELR_EL1 = 0
FAR_EL1 = 0
SPSR_EL1 = 0


[final]
expect = "sat"
assertion = """
  (0:PC = normal_end & 0:X3 = 3) |
  (0:PC = 0x4242400 &
   0:ELR_EL1 = faulting_instr &
   0:FAR_EL1 = x &
   0:ESR_EL1 = 0x92000007)
"""
