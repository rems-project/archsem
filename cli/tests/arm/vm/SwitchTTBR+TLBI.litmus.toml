arch = "AArch64"
name = "SwitchTTBR+TLBI"
symbolic = ["x"]

page_table_setup = """
option default_tables = false;
physical pa0 pa1;
*pa0 = 0;
*pa1 = 1;

s1table table0 0x2C0000 {
  x |-> pa0;
}

s1table table1 0x300000 {
  x |-> pa1;
}
"""

[thread.0]
init = { X0 = "table1", X2 = "x", TTBR0_EL1 = "table0", CurrentEL = 1 }
# With no ISB, the load may still use table0. Under ETS3, the DSB orders
# its translation after the TLBI, so adding table1 must preserve table0's refill.
code = """
TLBI VMALLE1IS
MSR TTBR0_EL1, X0
DSB SY
LDR X1, [X2]
"""

[final]
assertion = "0:X1 = 0"
