# Concrete ArchSem version of archsem-private/tests/new-phenomena/isla/
# TLBIVAL.FinalS1PTEStage2.litmus.toml.
#
# Fixed symbolic addresses:
#   x      = 0x0
#   ipa1   = 0x400000
#   pa1    = 0x500000
#   stage1 = 0x2c0000
#   stage2 = 0x240000
#   hyp    = 0x200000
#
# Question: does TLBI VAL leave intact the Stage-2 walk used to fetch the final
# Stage-1 PTE, allowing the final Stage-1 translation to succeed?

arch = "Arm"
name = "TLBIVAL.FinalS1PTEStage2"

[thread.0.regs]
_PC = 0x3000
R1 = 0x244618      # pte3(0x2c3000, stage2)
R3 = 0x2c3         # page(0x2c3000)
R4 = 0x0           # page(x), with x = 0
R7 = 0x0           # x
VBAR_EL1 = 0x1000
VBAR_EL2 = 0x2000
TTBR0_EL1 = 0x2c0000
TTBR1_EL1 = 0x2c0000
VTTBR_EL2 = 0x240000
TTBR0_EL2 = 0x200000
CurrentEL = 0b10
SPSel = 0b1
SPSR_EL2 = 0b00100
ELR_EL2 = 0x3020

[[memory]]
addr = 0x3000
kind = "code"
step = 4
data = [
  0xd2800002, # MOV X2, #0
  0xf9000022, # STR X2, [X1]
  0xd5033f9f, # DSB SY
  0xd50c8423, # TLBI IPAS2E1, X3
  0xd5033f9f, # DSB SY
  0xd50883a4, # TLBI VALE1IS, X4
  0xd5033f9f, # DSB SY
  0xd69f03e0, # ERET
  0xd2800028, # L: MOV X8, #1
  0xf94000e8  # LDR X8, [X7]
]

[[memory]]
addr = 0x1200
kind = "code"
step = 4
data = [
  0xd2800008, # MOV X8, #0
  0xd538402d, # MRS X13, ELR_EL1
  0x910011ad, # ADD X13, X13, #4
  0xd518402d, # MSR ELR_EL1, X13
  0xd69f03e0  # ERET
]

[[memory]]
addr = 0x2400
kind = "code"
step = 4
data = [
  0xd2800008, # MOV X8, #0
  0xd53c402d, # MRS X13, ELR_EL2
  0x910011ad, # ADD X13, X13, #4
  0xd51c402d, # MSR ELR_EL2, X13
  0xd69f03e0  # ERET
]

[thread.0]
breakpoints = [0x3028]

# Backing data page. The original test initialises *pa1 = 2.
[[memory]]
addr = 0x500000
step = 8
data = 0x2

# Stage-1 table rooted at 0x2c0000. x is initially mapped to ipa1.
[[memory]]
addr = 0x2c0000
kind = "pagetable"
step = 8
data = 0x2c1003

