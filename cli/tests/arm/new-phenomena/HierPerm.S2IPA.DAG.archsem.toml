# Concrete ArchSem version of archsem-private/tests/new-phenomena/isla/
# HierPerm.S2IPA.DAG.litmus.toml.
#
# Fixed symbolic addresses:
#   x         = 0x0
#   ipa_data  = 0x400000
#   ipa_l3_a  = 0x2c3000
#   ipa_l3_b  = 0x2c4000
#   pa1       = 0x500000
#   pa_l3     = 0x600000
#   stage1    = 0x2c0000
#   stage2    = 0x240000
#   hyp       = 0x200000
#
# Question: in a DAG-shaped Stage-2 setup, can an EL1 walk use a shared
# final Stage-1 table through ipa_l3_b after EL2 invalidates both Stage-2
# translations ipa_l3_a->pa_l3 and ipa_l3_b->pa_l3?
#
# The source DSL uses mkdesc2(table=ipa_l3_b, APTable=0b00).  APTable is a
# Stage-1 table-descriptor field; for APTable=0b00 no high attribute bits are
# set, so the concrete descriptor is just ipa_l3_b | 0x3 = 0x2c4003.

arch = "Arm"
name = "HierPerm.S2IPA.DAG"

[thread.0.regs]
_PC = 0x3000
R0 = 0x0
R1 = 0x244618      # pte3(ipa_l3_a, stage2), ipa_l3_a = 0x2c3000
R2 = 0x0
R3 = 0x2c2000      # pte2(x, stage1), x = 0
R4 = 0x2c4003      # mkdesc2(table=ipa_l3_b, APTable=0b00)
R5 = 0x244620      # pte3(ipa_l3_b, stage2), ipa_l3_b = 0x2c4000
R6 = 0x2c3         # page(ipa_l3_a)
R7 = 0x0           # x
R8 = 0x0
R9 = 0x2c4         # page(ipa_l3_b)
R10 = 0x0
R11 = 0x0
R12 = 0x0
R13 = 0x0
R14 = 0x0
R15 = 0x0
R16 = 0x0
R17 = 0x0
R18 = 0x0
R19 = 0x0
R20 = 0x0
R21 = 0x0
R22 = 0x0
R23 = 0x0
R24 = 0x0
R25 = 0x0
R26 = 0x0
R27 = 0x0
R28 = 0x0
R29 = 0x0
R30 = 0x0
VBAR_EL1 = 0x1000
VBAR_EL2 = 0x2000
TTBR0_EL1 = 0x2c0000
TTBR1_EL1 = 0x2c0000
VTTBR_EL2 = 0x240000
TTBR0_EL2 = 0x200000
TTBR1_EL2 = 0x200000
SCTLR_EL1 = 0x1
TCR_EL1 = 0x0
ID_AA64MMFR1_EL1 = 0x2000000000
ESR_EL1 = 0x0
ESR_EL2 = 0x0
ESR_EL3 = 0x0
FAR_EL1 = 0x0
FAR_EL2 = 0x0
FAR_EL3 = 0x0
ELR_EL1 = 0x0
CurrentEL = 0b10
SPSel = 0b1
SP_EL0 = 0x0
SP_EL1 = 0x0
SP_EL2 = 0x0
SP_EL3 = 0x0
SPSR_EL1 = 0x0
SPSR_EL2 = 0b00100
SPSR_EL3 = 0x0
ELR_EL2 = 0x3028
ELR_EL3 = 0x0
PAR_EL1 = 0x0
NZCV = 0x0
DAIF = 0x0

[[memory]]
addr = 0x3000
kind = "code"
step = 4
data = [
  0xd2800002, # MOV X2, #0
  0xf9000022, # STR X2, [X1]
  0xf90000a2, # STR X2, [X5]
  0xd5033f9f, # DSB SY
  0xd50c8426, # TLBI IPAS2E1, X6
  0xd50c8429, # TLBI IPAS2E1, X9
  0xd5033f9f, # DSB SY
  0xf9000064, # STR X4, [X3]
  0xd5033f9f, # DSB SY
  0xd69f03e0, # ERET
  0xd2800548, # L: MOV X8, #42
  0xf90000e8  # STR X8, [X7]
]

[[memory]]
addr = 0x1200
kind = "code"
step = 4
data = [
  0xd2800008, # MOV X8, #0
  0xd538402d, # MRS X13, ELR_EL1
  0x910011ad, # ADD X13, X13, #4
  0xd518402d, # MSR ELR_EL1, X13
  0xd69f03e0  # ERET
]

[[memory]]
