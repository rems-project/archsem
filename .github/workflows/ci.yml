name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  merge_group:


jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    # Cancels in-progress job when a new push is performed (except on main)
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ !contains(github.ref, 'main')}}


    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install system dependencies (ubuntu)
      run: |
        sudo apt update
        sudo apt install -y build-essential z3 cmake pkg-config clang-18 lld-18
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 180
        sudo update-alternatives --set clang /usr/bin/clang-18
        clang --version

    - name: Get up-to-date OPAM
      run: |
        wget -O opam-2.5 https://github.com/ocaml/opam/releases/download/2.5.0/opam-2.5.0-x86_64-linux

    - name: Check OPAM signature
      run: |
        echo "7aae51da01a66666c8733130852c2c00546eff486effb0999b78145cb75aee74  opam-2.5" | sha256sum --check

    - name: Install OPAM
      run: |
        sudo install opam-2.5 /usr/local/bin/opam

    - name: Restore OPAM cache
      id: cache-opam-restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.opam
        key: locked-doc-${{ hashFiles('*.opam.locked') }}

    - name: Initialize OPAM
      if: ${{ steps.cache-opam-restore.outputs.cache-hit != 'true' }}
      run: |
        opam init --yes --no-setup --bare --disable-sandboxing --shell=sh

    - name: Add Rocq OPAM repo
      if: ${{ steps.cache-opam-restore.outputs.cache-hit != 'true' }}
      run: |
        opam repo add --yes --set-default rocq-released https://rocq-prover.org/opam/released

    - name: Create OPAM switch
      if: ${{ steps.cache-opam-restore.outputs.cache-hit != 'true' }}
      run: |
        opam switch create --empty archsem-switch

    - name: Install OPAM dependencies
      if: ${{ steps.cache-opam-restore.outputs.cache-hit != 'true' }}
      run: |
        opam install . --deps-only --locked --with-test --with-dev-setup --with-doc --confirm-level=unsafe-yes

    - name: Clean OPAM folder for caching
      if: ${{ steps.cache-opam-restore.outputs.cache-hit != 'true' }}
      run: |
        opam clean
        opam clean -r
        opam clean -c
        rm -rf ~/.opam/archsem-switch/.opam-switch/sources
        rm -rf ~/.opam/repo/

    - name: Save OPAM cache
      uses: actions/cache/save@v4
      if: ${{ steps.cache-opam-restore.outputs.cache-hit != 'true' }}
      with:
        path: ~/.opam
        key: locked-doc-${{ hashFiles('*.opam.locked') }}

    - name: Build
      run: |
        opam exec -- dune build

    - name: Run tests
      run: |
        opam exec -- dune runtest

    - name: Check formatting
      run: |
        opam exec -- dune build @fmt

    - name: Check build is clean
      run: |
        git diff --quiet

    - name: Check Licence headers are up to date
      run: |
        eval $(opam env)
        make headers
        git diff --quiet

    - name: Build documentation
      run: |
        opam exec -- dune build @doc

    - name: Assemble documentation site
      run: |
        ./etc/mk-doc-site.sh _site

    - name: Upload GitHub Pages artifact
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  # Publishes the documentation on https://rems-project.github.io/archsem/
  deploy-docs:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Never run two Pages deployments at once, and never cancel one halfway
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
